# ============================================================
# nginx 反向代理設定 — Oasis 綠洲
# ============================================================
# 使用前請將所有 your-domain.com 替換成你的真實網域，
# 並確認 Let's Encrypt 憑證路徑正確（執行 certbot 後自動生成）。
# ============================================================

# 強制 HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt ACME challenge（certbot webroot 模式需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主設定
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── Let's Encrypt 憑證（執行 certbot 後自動生成）───────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── 安全標頭 ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # ── 靜態檔案：讓 nginx 直接提供，不走 Python（效能關鍵）────────
    location /static/ {
        alias /app/www/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ── 上傳圖片（使用者上架的圖片）────────────────────────────────
    location /static/uploads/ {
        alias /app/www/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── 其餘請求轉給 Gunicorn（FastAPI）──────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # 上傳圖片時間稍長，給 30 秒超時
        proxy_read_timeout 30s;
        client_max_body_size 20M;
    }
}
