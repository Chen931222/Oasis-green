<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png" />
  <title>Oasis 綠洲｜忘記密碼</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="/static/style.css?v=20260601a" />
</head>

<body data-page="forgot-password">
  <nav class="navbar">
    <a class="brand" href="/">Oasis 綠洲</a>
    <div class="nav-links">
      <a href="/">首頁</a>
      <a href="/explore">探索空間</a>
      <a href="/recommend">智慧推薦</a>
      <a href="/co-rental">拼場</a>
      <a href="/login">登入</a>
      <a href="/register">註冊</a>
      <a href="/contact">聯絡我們</a>
    </div>
  </nav>

  <main class="section container narrow">
    <div class="page-title">
      <h1>忘記密碼</h1>
      <p>輸入你的註冊信箱，我們會寄送密碼重設連結給你。</p>
    </div>
    <form id="forgot-form" class="form-card admin-login-card">
      <label>
        註冊信箱
        <input id="forgot-email" type="email" placeholder="例如：user@example.com" required />
      </label>
      <label>
        驗證碼
        <span style="display:flex;align-items:center;gap:10px;margin-top:4px">
          <span id="captcha-question" style="font-weight:600;font-size:1.05rem;color:var(--primary-dark)">載入中…</span>
          <button type="button" id="captcha-refresh" style="background:none;border:none;cursor:pointer;color:var(--primary);font-size:1.1rem;padding:0" title="換一題"><i class="ri-refresh-line"></i></button>
        </span>
        <input id="captcha-answer" type="text" inputmode="numeric" placeholder="請輸入數字答案" autocomplete="off" required />
      </label>
      <input type="hidden" id="captcha-id" />
      <input type="text" id="hp" name="hp" style="position:absolute;left:-9999px;top:-9999px" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <button type="submit">寄送重設連結</button>
      <p id="forgot-error" class="form-error hidden"></p>
    </form>
    <div id="forgot-success" class="success-box hidden"></div>
  </main>

  <footer class="footer">
    © 2026 Oasis 綠洲 ·
    <a href="/terms">服務條款</a> ·
    <a href="/privacy">隱私政策</a> ·
    <a href="/contact">聯絡我們</a>
  </footer>
  <script src="/static/main.js?v=20260601a"></script>
</body>

</html>
