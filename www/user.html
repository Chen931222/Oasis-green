<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oasis 綠洲｜使用者中心</title>
  <link rel="stylesheet" href="/static/style.css?v=20260531a" />
</head>

<body data-page="user">
  <nav class="navbar">
    <a class="brand" href="/">Oasis 綠洲</a>
    <div class="nav-links">
      <a href="/">首頁</a>
      <a href="/explore">探索空間</a>
      <a href="/host">上架空間</a>
      <a href="/contact">聯絡我們</a>
    </div>
  </nav>

  <main class="section container">
    <div class="page-title">
      <div class="page-title-row">
        <h1>使用者中心</h1>
        <button id="user-logout-button" type="button" class="logout-outline-btn">登出</button>
      </div>
      <p id="user-welcome">登入後可以送出空間上架申請。</p>
    </div>
    <section class="user-section">
      <h2>個人資料設定</h2>
      <form id="profile-form" class="form-card">
        <div class="form-grid">
          <label>
            顯示名稱
            <input id="profile-name" type="text" placeholder="留空表示不修改" />
          </label>
        </div>
        <label>
          目前密碼（修改密碼時必填）
          <input id="profile-current-password" type="password" autocomplete="current-password" />
        </label>
        <label>
          新密碼（留空表示不修改）
          <input id="profile-new-password" type="password" autocomplete="new-password" />
        </label>
        <button type="submit">儲存設定</button>
        <p id="profile-message" class="form-error hidden"></p>
      </form>
    </section>
    <section class="user-section">
      <h2>我的上架空間</h2>
      <div id="user-space-list" class="booking-list"></div>
    </section>
    <section class="user-section">
      <h2>我的空間收到的預約申請</h2>
      <div id="owner-booking-list" class="booking-list"></div>
    </section>
    <section class="user-section">
      <h2>預約行事曆</h2>
      <div id="booking-calendar" class="booking-calendar"></div>
    </section>
    <section class="user-section">
      <h2>我的預約紀錄</h2>
      <div id="user-booking-list" class="booking-list"></div>
    </section>
  </main>

  <footer class="footer">© 2026 Oasis 綠洲</footer>
  <script src="/static/main.js?v=20260531a"></script>
</body>

</html>
