<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 綠色地球：品牌綠圓底＋白色經緯線。16px 下也要讀得出「地球」，線寬不能再細。 -->
  <circle cx="16" cy="16" r="15" fill="#1d9e75"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#14785a" stroke-width="1.5"/>
  <!-- 赤道與兩條緯線 -->
  <line x1="1.8" y1="16" x2="30.2" y2="16" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M4.6 8.6 Q 16 12.2 27.4 8.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M4.6 23.4 Q 16 19.8 27.4 23.4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 中央經線橢圓 -->
  <ellipse cx="16" cy="16" rx="6.8" ry="15" fill="none" stroke="#fff" stroke-width="1.6"/>
</svg>
