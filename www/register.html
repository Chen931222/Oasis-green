<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oasis 綠洲｜註冊</title>
  <link rel="stylesheet" href="/static/style.css?v=20260531a" />
</head>

<body data-page="register">
  <nav class="navbar">
    <a class="brand" href="/">Oasis 綠洲</a>
    <div class="nav-links">
      <a href="/">首頁</a>
      <a href="/explore">探索空間</a>
      <a href="/recommend">智慧推薦</a>
      <a href="/co-rental">拼場</a>
      <a href="/login">登入</a>
      <a href="/register">註冊</a>
      <a href="/contact">聯絡我們</a>
    </div>
  </nav>

  <main class="section container narrow">
    <div class="page-title">
      <h1>註冊</h1>
      <p>建立一般使用者帳號後，就可以送出空間上架申請。</p>
    </div>
    <form id="register-form" class="form-card admin-login-card">
      <label>
        姓名
        <input id="register-name" type="text" required />
      </label>
      <label>
        信箱
        <input id="register-email" type="email" required />
      </label>
      <label>
        密碼
        <input id="register-password" type="password" required />
      </label>
      <label>
        驗證碼
        <span style="display:flex;align-items:center;gap:10px;margin-top:4px">
          <span id="captcha-question" style="font-weight:600;font-size:1.05rem;color:var(--primary-dark)">載入中…</span>
          <button type="button" id="captcha-refresh" style="background:none;border:none;cursor:pointer;color:var(--primary);font-size:1.1rem;padding:0" title="換一題">↻</button>
        </span>
        <input id="captcha-answer" type="text" inputmode="numeric" placeholder="請輸入數字答案" autocomplete="off" required />
      </label>
      <input type="hidden" id="captcha-id" />
      <input type="text" id="hp" name="hp" style="position:absolute;left:-9999px;top:-9999px" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <button type="submit">註冊</button>
      <p id="register-error" class="form-error hidden"></p>
    </form>
    <div id="register-success" class="success-box hidden"></div>
  </main>

  <footer class="footer">© 2026 Oasis 綠洲</footer>
  <script src="/static/main.js?v=20260531a"></script>
</body>

</html>
