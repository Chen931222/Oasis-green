<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oasis 綠洲｜重設密碼</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="/static/style.css?v=20260601a" />
</head>

<body data-page="reset-password">
  <nav class="navbar">
    <a class="brand" href="/">Oasis 綠洲</a>
    <div class="nav-links">
      <a href="/">首頁</a>
      <a href="/explore">探索空間</a>
      <a href="/login">登入</a>
      <a href="/contact">聯絡我們</a>
    </div>
  </nav>

  <main class="section container narrow">
    <div class="page-title">
      <h1>重設密碼</h1>
      <p>請輸入你的新密碼（至少 6 個字元）。</p>
    </div>
    <form id="reset-form" class="form-card admin-login-card">
      <label>
        新密碼
        <input id="reset-password" type="password" autocomplete="new-password" required />
      </label>
      <label>
        確認新密碼
        <input id="reset-password-confirm" type="password" autocomplete="new-password" required />
      </label>
      <button type="submit">確認重設密碼</button>
      <p id="reset-error" class="form-error hidden"></p>
    </form>
    <div id="reset-success" class="success-box hidden"></div>
  </main>

  <footer class="footer">
    © 2026 Oasis 綠洲 ·
    <a href="/terms">服務條款</a> ·
    <a href="/privacy">隱私政策</a> ·
    <a href="/contact">聯絡我們</a>
  </footer>
  <script src="/static/main.js?v=20260601a"></script>
</body>

</html>
